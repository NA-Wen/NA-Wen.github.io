{% include base_path %}

<a class="skip-link" href="#main">Skip to content</a>
<header class="site-header">
  <div class="site-header__inner">
    <a class="site-wordmark" href="{{ base_path }}/" aria-label="{{ site.title }} — home">
      <span class="site-monogram" aria-hidden="true">2000</span>
      <span>{{ site.title }}</span>
    </a>
    <nav class="site-navigation" aria-label="Main navigation">
      <a href="{{ base_path }}/"{% if page.url == '/' %} aria-current="page"{% endif %}>About</a>
      {% for link in site.data.navigation.main %}
        {% if link.url contains 'http' %}{% assign domain = '' %}{% else %}{% assign domain = base_path %}{% endif %}
        <a href="{{ domain }}{{ link.url }}"{% if page.url == link.url %} aria-current="page"{% endif %}>{{ link.title }}</a>
      {% endfor %}
    </nav>
  </div>
</header>
